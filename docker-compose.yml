# docker compose up -d --build   ->  http://localhost:8000
# Needs a .env next to this file (copy .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsaxle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sportsaxle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # host-only, so make feed / make wipe can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsaxle -d sportsaxle"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sportsaxle:${POSTGRES_PASSWORD}@db:5432/sportsaxle
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_PIN: ${ADMIN_PIN:?set ADMIN_PIN in .env}
      BID_INCREMENT: ${BID_INCREMENT:-100}
      BID_SECONDS: ${BID_SECONDS:-30}
      SEED_FILE: ${SEED_FILE:-}
    volumes:
      - ./backend/photos:/app/backend/photos:ro  # seeded staff photos (never in the image)
    ports:
      - "${PORT:-8000}:8000"

volumes:
  pgdata:
