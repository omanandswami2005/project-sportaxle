 }

 // ---- scene 1: arms click, ball thuds on the beat grid ----

 // ---- scene 5: logo sting, wordmark, sign-off ----

 [523.25,659.25,783.99,1046.5,1318.5,1568,2093].forEach(function(f,i){tone('triangle',f,t0+19+i*.0625,.9,.05,null,1)});

 [].forEach.call(document.querySelectorAll('.scene .tx'),function(e){var sc=scenes.indexOf(e.closest('.scene'));if(e.dataset.q==='0')return;
  e._t.forEach(function(tt,n){tone('triangle',P[n%5],t0+sc*4+tt,.1,.045,null,1)});if(e._b!==null)ding(t0+sc*4+e._b,1318.5)});
