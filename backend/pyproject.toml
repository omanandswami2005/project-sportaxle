[project]
name = "sportsaxle-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.54.0",
    "pillow>=12.3.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom
